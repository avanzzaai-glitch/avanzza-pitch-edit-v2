name: Render Avanzza Pitch Video

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install

      - name: Create output dir
        run: mkdir -p out

      - name: Render video
        run: npm run render 2>&1 | tail -100

      - name: Check output
        run: ls -lh out/

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avanzza-pitch-final
          path: out/avanzza_pitch_final.mp4
          retention-days: 7
